<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiralOut.net | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    
</head>

<body style="display: flex;">
    <div>
        <canvas id="myChart" style="position: relative; height: 40vh; width: 40vh"></canvas>
    </div>
    
        <!-- Navbar -->
    <header>
        <a href="index.html"> <img src="assets/imgs/logo_navbar_tool.svg" alt="Imagem da logo da navbar" class="logo"></a>

        <ul class="nav_list">
            <li><a href="quiz.html">VOLTAR PARA O QUIZ</a></li>
        </ul>
    </header>

    <h2>Estatística do Quiz</h2>

    <!-- KPIs -->
     <div id="kpis">
        <div class="kpi-card">
            <span class="kpi-titulo">Total de Quizzes</span>
            <span class="kpi-valor" id="kpiMelhor">...</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-titulo">Média de Acertos</span>
            <span class="kpi-valor" id="kpiMedia">...</span>
        </div>
     </div>

     <!-- Gráfico -->
      <div id="grafico-container">
        <canvas id="graficosAcertos"></canvas>
      </div>
</body>

<script>
    /* aqui busca dados da API */
    fetch("/dashboard/dados")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            /* para preencher as kpis */
            document.getElementById("kpiTotal").innerHTML = dados.total ;
            document.getElementById("kpiMelhor").innerHTML = dados.melhorPontuacao + " / 5" ;
            document.getElementById("kpiMedia").innerHTML = dados.mediaAcertos + "%" ;

            /* agora monta o array de valore para o gráfico */
            var labels = dados.acertosPorQuestao.map(function (q) {
                return "Questão " + q.numero_questao;
            });
            var valores = dados.acertosPorQuestao.map(function(q) {
                return q.total_acertos;
            });

            /* para criar o gráfico de barras com o chart.js */
            new Chart(document.getElementById("graficoAcertos"), {
                type: "bar",
                data: {
                    labels : labels,
                    datasets: [{
                        label : "Usuários que acertaram",
                        data: valores,
                        backgroundColor : "rgba(201, 162, 39, 0.7)",
                        borderColor: "rgb(201, 162, 39)",
                        borderWidth: 2
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1 }
                        }
                    }
                }
            });
        })
        .catch(function (erro) {
            console.log("Erro ao carregar dados da dashboard: ", erro);
        });
</script>
</html>
