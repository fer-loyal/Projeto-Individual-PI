<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiralOut.net | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./css/dashboard.css" />

    
</head>

<body style="display: flex;" onload="buscarTotalDeQuizzes (), buscarMediaDeAcertos(), obterDadosGrafico()">

    <!-- Navbar -->
    <header>
        <a href="index.html"> <img src="assets/imgs/logo_navbar_tool.svg" alt="Imagem da logo da navbar" class="logo"></a>

        <ul class="nav_list">
            <li><a href="quiz.html">VOLTAR PARA O QUIZ</a></li>
        </ul>
    </header>

    <!-- KPIs -->
     <div id="kpis">
        <div class="kpi-card">
            <span class="kpi-titulo">Total de Quizzes feitos por Você</span>
            <span class="kpi-valor" id="kpiMelhor">...</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-titulo">Média dos Seus Acertos</span>
            <span class="kpi-valor" id="kpiMedia">...</span>
        </div>
     </div>

     <br><br><br><br>

    <div>
        <h1>Acertos por tentativa</h1>
        <canvas id="myChart"></canvas>

    </div>

    <!-- <h2>Estatística do Quiz</h2>
      <div id="grafico-container">
        <canvas id="graficoAcertos"></canvas>
      </div> -->
</body>

<script>
    function buscarTotalDeQuizzes (){
        var fkUsuario = sessionStorage.ID_USUARIO;
        var kpiTotalQuizzes = document.getElementById('kpiMelhor');

        fetch(`/dashboard/total-quizzes/${fkUsuario}`)
        .then(function (resposta)
        {
            if (resposta.ok)
            {
                resposta.json().then(function (dados)
                {
                    kpiTotalQuizzes.innerHTML = `${dados[0].total}`;
                }   
            )
                
            }

            else {
                throw "Houve um erro ao tentar realizar o cadastro!";
            }
        })
        .catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            //finalizarAguardar();
        });
        }



        function buscarMediaDeAcertos (){
        var fkUsuario = sessionStorage.ID_USUARIO;
        var kpiMediaQuizzes = document.getElementById('kpiMedia');

        fetch(`/dashboard/media-quizzes/${fkUsuario}`)
        .then(function (resposta)
        {
            if (resposta.ok)
            {
                resposta.json().then(function (dados)
                {
                    kpiMediaQuizzes.innerHTML = `${dados[0].media}%`;
                }   
            )
                
            }

            else {
                throw "Houve um erro ao tentar realizar o cadastro!";
            }
        })
        .catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            //finalizarAguardar();
        });
        }





        // O gráfico é construído com três funções:
    // 1. obterDadosGrafico -> Traz dados do Banco de Dados para montar o gráfico da primeira vez
    // 2. plotarGrafico -> Monta o gráfico com os dados trazidos e exibe em tela
    // 3. atualizarGrafico -> Atualiza o gráfico, trazendo novamente dados do Banco

    // Esta função *obterDadosGrafico* busca os últimos dados inseridos em tabela de medidas.
    // para, quando carregar o gráfico da primeira vez, já trazer com vários dados.
    // A função *obterDadosGrafico* também invoca a função *plotarGrafico*

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function obterDadosGrafico(fkUsuario) {

        // alterarTitulo(idAquario)
        var fkUsuario = sessionStorage.ID_USUARIO;

        proximaAtualizacao = null;

        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/dashboard/grafico-quizzes/${fkUsuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGrafico(resposta,fkUsuario);

                });
            }
            
            else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
    // Configura o gráfico (cores, tipo, etc), materializa-o na página e, 
    // A função *plotarGrafico* também invoca a função *atualizarGrafico*
    function plotarGrafico(resposta, fkUsuario) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Acertos',
                data: [],
                fill: false,
                borderColor: '#c9a227',
                tension: 0.1
            }]
        };
        console.log('Dados para o gráfico:', dados.datasets[0].data);
        console.log('Tipos:', dados.datasets[0].data.map(v => typeof v));
        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++)
        {
            var registro = resposta[i];

            //labels.push(registro.momento_grafico);
            
            labels.push(registro.data_formatada)
            dados.datasets[0].data.push(Number(registro.pontuacaoFinal));
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'line',
            data: dados,
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById(`myChart`),
            config
        );

        //setTimeout(() => atualizarGrafico(fkUsuario, dados, myChart), 2000);
    }

</script>
</html>
